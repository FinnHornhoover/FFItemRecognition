name: Item Recognition Web Update and Deploy

on:
  schedule:
    # Run every 24 hours at 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit and push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Set up Google Service Account
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > resources/google-service-account.json

      - name: Run prepare_embeds_model.py
        run: |
          python src/prepare_embeds_model.py --project item-recognition-web

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"

      - name: Check for changes
        id: check-changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.check-changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: item-recognition-web/package-lock.json

      - name: Install npm dependencies
        if: steps.check-changes.outputs.changed == 'true'
        working-directory: item-recognition-web
        run: npm ci

      - name: Build project
        if: steps.check-changes.outputs.changed == 'true'
        working-directory: item-recognition-web
        run: npm run build

      - name: Commit changes
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git commit -m "chore: auto-update embeddings and model [skip ci]"
          git push origin main

      - name: Deploy to Cloudflare Pages
        if: steps.check-changes.outputs.changed == 'true'
        working-directory: item-recognition-web
        run: |
          npx wrangler pages deploy dist/ --project-name retrobution-shoplist
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
